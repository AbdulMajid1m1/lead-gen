# leadgen.deventiatech.com — LeadSignal web app.
#
# Proxies to the frontend container (nginx serving the built SPA), which in turn
# proxies /api to the api container over the compose network. Keeping the API on
# the same origin as the app means no CORS preflight on every request and no API
# hostname baked into the JS bundle at build time.
#
# Install: /etc/nginx/sites-available/leadgen-app

server {
    listen 80;
    listen [::]:80;
    server_name leadgen.deventiatech.com;

    # Certbot needs this to stay on :80 for renewals.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;   # http2 omitted: server runs nginx 1.24, which predates the `http2 on` directive
    listen [::]:443 ssl;
    server_name leadgen.deventiatech.com;

    ssl_certificate     /etc/letsencrypt/live/leadgen.deventiatech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leadgen.deventiatech.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/leadgen-app.access.log;
    error_log  /var/log/nginx/leadgen-app.error.log;

    client_max_body_size 10M;

    # HSTS. Only safe because every leadgen host is HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Discovery and research progress are Server-Sent Events streams. Every one
    # of these four lines matters: with buffering on, a user watching a ten
    # minute discovery run sees nothing at all and then every event at once.
    location /api/ {
        proxy_pass http://127.0.0.1:6890;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:6890;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
