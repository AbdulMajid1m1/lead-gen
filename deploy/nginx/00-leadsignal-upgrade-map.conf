# Install to /etc/nginx/conf.d/00-leadsignal-upgrade-map.conf
#
# $connection_upgrade is what lets a proxied WebSocket work while leaving plain
# HTTP keepalive intact. It has to live at http{} level, which is why it is a
# conf.d snippet rather than part of either vhost. Harmless if another app on
# this server already defines it — in that case just delete this file.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
