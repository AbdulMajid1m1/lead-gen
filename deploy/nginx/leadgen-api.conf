# leadgenapi.deventiatech.com — LeadSignal API, direct.
#
# The web app does NOT go through this host (it calls a same-origin /api). This
# vhost exists for integrations, webhooks and debugging, so it is CORS-governed
# by the API's own ALLOWED_ORIGINS rather than by nginx.
#
# Install: /etc/nginx/sites-available/leadgen-api

server {
    listen 80;
    listen [::]:80;
    server_name leadgenapi.deventiatech.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name leadgenapi.deventiatech.com;

    ssl_certificate     /etc/letsencrypt/live/leadgenapi.deventiatech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leadgenapi.deventiatech.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/leadgen-api.access.log;
    error_log  /var/log/nginx/leadgen-api.error.log;

    client_max_body_size 10M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:6690;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Same SSE reasoning as the app vhost — /api/discovery-runs/:id/events
        # is reachable here too.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
