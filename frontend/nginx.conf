server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed asset filenames are immutable; index.html must never be cached or
  # users keep loading a stale bundle after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location /api/ {
    proxy_pass http://api:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Discovery progress is a Server-Sent Events stream: buffering it would
    # deliver the whole run's progress in one burst at the end.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # Client-side routing: unknown paths resolve to the SPA entry point.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
