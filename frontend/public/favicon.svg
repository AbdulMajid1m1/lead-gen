<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="LeadSignal">
  <title>LeadSignal</title>
  <!--
    The LeadSignal mark: an L (Lead) whose corner is turned rather than mitred,
    with a beacon node in the counter (Signal). Kept to two shapes so it still
    reads as a monogram at 16px, where anything finer collapses.

    The gradient is the brand pair from frontend/src/index.css (brand-from and
    brand-to) baked to hex. A favicon cannot read CSS variables, so the two have
    to be kept in step by hand.
  -->
  <defs>
    <linearGradient id="ls-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dc7e58"/>
      <stop offset="1" stop-color="#b7543b"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12.5" fill="url(#ls-tile)"/>
  <g transform="translate(-0.4 1.0)">
    <path d="M13.8 9.2 V30.0 A6.8 6.8 0 0 0 20.6 36.8 H30.4"
          fill="none" stroke="#fef9f5" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32.8" cy="14.8" r="5.0" fill="#fef9f5"/>
  </g>
</svg>
